# /etc/nginx/sites-available/ubiblio.conf (symlinked from sites-enabled)
# ubiblio.byst.re -> http://[IPv6]:5005 -> container on 127.0.0.1:5105
server {
    listen [::]:5005;
    server_tokens off;
    # shelf photos: up to PHOTO_IMPORT_MAX_IMAGES files per upload
    client_max_body_size 100m;

    location ~ /\. { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:5105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}
