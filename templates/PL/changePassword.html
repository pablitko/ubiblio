{% extends "base.html" %}
{% block main %}
<section id="two">
  <div class="inner" style="padding: 20px 0 1em 0">
    <h1>Zmień hasło</h1>
    {% for error in errors %}
    <p style="color: red">{{ error }}</p>
    {% endfor %}
    {% if msg %}
    <p style="color: green">{{ msg }}</p>
    {% endif %}
    <form action="/auth/password" method="post">
      <p><label for="current">Obecne hasło</label><input type="password" id="current" name="current" autocomplete="current-password" required></p>
      <p><label for="new">Nowe hasło</label><input type="password" id="new" name="new" minlength="8" autocomplete="new-password" required></p>
      <p><label for="confirm">Powtórz nowe hasło</label><input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required></p>
      <p>Co najmniej 8 znaków. Na innych urządzeniach, na których jesteś zalogowany, sesja trwa do jej wygaśnięcia.</p>
      <input type="submit" value="Zmień hasło">
    </form>
  </div>
</section>
{% endblock %}
