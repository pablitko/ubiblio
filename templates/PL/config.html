{% extends "base.html" %}
{% block main %}

<!-- Banner -->
<!-- Two -->
	<section id="two">
		<div class="inner" style = "padding: 20px 0 1em 0;">

<h1>Ustawienia biblioteki</h1>

{% for error in errors %}
    <p style="color: red">{{ error }}</p>
{% endfor %}
<div style="display:block; clear:both; float:none;">
<div style="width:30%; min-width: 300px; float:left; margin-right:30px;">
<form action="/config" method="post">
        <p>Wersja bazy: {{ config.version }}</p>
	  <input type="hidden" id="version" name="version" value="{{ config.version }}"> 
    <p>
        <p><label for="">Włącz zdjęcia okładek: </label></p>
	<select name="coverImages" id="coverImages">
					<option value="{{ config.coverImages }}" selected>{{ config.coverImages }}</option>
  <option value="True">Tak</option>
  <option value="False">Nie</option>
</select>
    </p>
    <p>
        <p><label for="">Nazwa pola własnego 1 (puste = wyłączone): </label></p>
        <input type="text" name="customFieldName1" value="{{ config.customFieldName1 }}">
    </p>
    <p>
        <p><label for="">Nazwa pola własnego 2 (puste = wyłączone): </label></p>
        <input type="text" name="customFieldName2" value="{{ config.customFieldName2 }}">
    </p>

    <p>
        <p><label for="">Gatunki (oddzielone przecinkami): </label></p>
        <input type="text" name="genres" value="{{ config.genres }}">
    </p>
    </div>
    <div style= "display:block; clear:both;float:none;">
    <input  type="submit" value="Zatwierdź">
    
</form>
<a style = "border:none;" href = "/"> <button>Wstecz</button></a>
<div style="margin-top:50px;">
	<h4><u>Inne ustawienia i funkcje</u></h4>
<a style = "border:none;" href = "/userManagement"> <button>Użytkownicy</button></a>
<a style = "border:none;" href = "/backups"> <button>Kopie zapasowe</button></a>
</div>
<div style="margin-top:50px;">
<a style = "border:none;" href = "/stats"> <button>Statystyki biblioteki</button></a>
<a style = "border:none;" href = "/manageVkeys"> <button>Federacja</button></a>

	</div>
    </div>

<hr>

</div>

</div>

</section>
{% endblock %}
