{% extends "base.html" %}
{% block main %}
<section id="two">
  <div class="inner" style="padding: 20px 0 1em 0">
    <h1>Changer le mot de passe</h1>
    {% for error in errors %}
    <p style="color: red">{{ error }}</p>
    {% endfor %}
    {% if msg %}
    <p style="color: green">{{ msg }}</p>
    {% endif %}
    <form action="/auth/password" method="post">
      <p><label for="current">Mot de passe actuel</label><input type="password" id="current" name="current" autocomplete="current-password" required></p>
      <p><label for="new">Nouveau mot de passe</label><input type="password" id="new" name="new" minlength="8" autocomplete="new-password" required></p>
      <p><label for="confirm">Répétez le nouveau mot de passe</label><input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required></p>
      <p>Au moins 8 caractères. Les autres appareils où vous êtes connecté le restent jusqu'à l'expiration de leur session.</p>
      <input type="submit" value="Changer le mot de passe">
    </form>
  </div>
</section>
{% endblock %}
