{% extends "base.html" %}
{% block main %}
<section id="two">
  <div class="inner" style="padding: 20px 0 1em 0">
    <h1>Change Password</h1>
    {% for error in errors %}
    <p style="color: red">{{ error }}</p>
    {% endfor %}
    {% if msg %}
    <p style="color: green">{{ msg }}</p>
    {% endif %}
    <form action="/auth/password" method="post">
      <p><label for="current">Current password</label><input type="password" id="current" name="current" autocomplete="current-password" required></p>
      <p><label for="new">New password</label><input type="password" id="new" name="new" minlength="8" autocomplete="new-password" required></p>
      <p><label for="confirm">Repeat the new password</label><input type="password" id="confirm" name="confirm" minlength="8" autocomplete="new-password" required></p>
      <p>At least 8 characters. Other devices where you are logged in stay logged in until their session expires.</p>
      <input type="submit" value="Change password">
    </form>
  </div>
</section>
{% endblock %}
